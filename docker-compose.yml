services:
  # MySQL Database (dùng khi không có XAMPP/MySQL local)
  mysql:
    image: mysql:8.0
    container_name: ecommerce-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root123}
      MYSQL_DATABASE: ${DB_NAME:-ecommerce_db}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./ecommerce_db_updated.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ecommerce-network
    profiles:
      - with-mysql

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ecommerce-backend
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      DB_HOST: ${DB_HOST:-host.docker.internal}
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD:-}
      DB_NAME: ${DB_NAME:-ecommerce_db}
      ACCESS_TOKEN_SECRET: ${JWT_SECRET:-your-super-secret-key-change-in-production}
      ACCESS_TOKEN_EXPIRES_IN: ${JWT_EXPIRES_IN:-24h}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
    ports:
      - "3001:3000"
    volumes:
      - ./data/image:/data/image
    networks:
      - ecommerce-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE: ${VITE_API_BASE:-http://localhost:3001/api/v1}
    container_name: ecommerce-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    networks:
      - ecommerce-network
    depends_on:
      - backend

  # phpMyAdmin - MySQL Web Interface
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: ecommerce-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: ${DB_HOST:-host.docker.internal}
      PMA_PORT: ${DB_PORT:-3306}
      PMA_USER: ${DB_USER:-root}
      PMA_PASSWORD: ${DB_PASSWORD:-}
    ports:
      - "8080:80"
    networks:
      - ecommerce-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  ecommerce-network:
    driver: bridge

volumes:
  mysql_data:

