version: 1
frontend:
  phases:
    preBuild:
      commands:
        - cd frontend
        - npm install
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: frontend/dist
    files:
      - '**/*'
  cache:
    paths:
      - frontend/node_modules/**/*
  
  # ⚠️ QUAN TRỌNG: Cấu hình cho Single Page Application (SPA)
  # Redirect tất cả requests về index.html để React Router có thể xử lý
  # Khắc phục lỗi 404 khi refresh trang tại các routes như /admin/dashboard/, /products, /cart, etc.
  customHeaders:
    - pattern: '**/*'
      headers:
        - key: 'Cache-Control'
          value: 'public, max-age=31536000, immutable'
        - key: 'Strict-Transport-Security'
          value: 'max-age=31536000; includeSubDomains'
        - key: 'X-Content-Type-Options'
          value: 'nosniff'
        - key: 'X-Frame-Options'
          value: 'DENY'
        - key: 'X-XSS-Protection'
          value: '1; mode=block'
    - pattern: '/index.html'
      headers:
        - key: 'Cache-Control'
          value: 'no-cache, no-store, must-revalidate'
  
  # ⚠️ CRITICAL: SPA Redirect Rules
  # Redirect all non-file requests to index.html for client-side routing
  # This fixes 404 errors when refreshing pages like:
  # - /admin/dashboard/, /admin/orders/, /admin/users/
  # - /products, /products/:id, /cart, /checkout
  # - /login, /register, /profile
  customRules:
    - source: '</^[^.]+$|\.(?!(css|gif|ico|jpg|js|png|txt|svg|woff|woff2|ttf|map|json|webp)$)([^.]+$)/>'
      target: '/index.html'
      status: 200
      condition: null
