name: CD Backend (Docker Hub + EC2)

on:
  workflow_run:
    workflows: ['CI Backend']
    types: [completed]
    branches: ['main']
  workflow_dispatch:

env:
  DOCKERHUB_REPO: ${{ secrets.DOCKERHUB_USERNAME }}/mini-ecommerce-backend

jobs:
  deploy-backend:
    name: Build, Push to Docker Hub & Deploy to EC2
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # ---------- Docker Hub ----------
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.DOCKERHUB_REPO }}:${{ github.event.workflow_run.head_sha }}
            ${{ env.DOCKERHUB_REPO }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ---------- Deploy to EC2 ----------
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            # Login to Docker Hub
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

            # Pull latest image
            docker pull ${{ env.DOCKERHUB_REPO }}:latest

            # Navigate to project dir and restart backend
            cd mini-ecommerce || exit 1
            docker compose -f docker-compose.production.yml pull backend
            docker compose -f docker-compose.production.yml up -d backend

            # Cleanup old images
            docker image prune -f

            echo "✅ Backend deployed successfully"
