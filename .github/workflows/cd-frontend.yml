name: CD Frontend (Amplify)

on:
  workflow_run:
    workflows: ['CI Frontend']
    types: [completed]
    branches: ['main']
  workflow_dispatch:

jobs:
  deploy-frontend:
    name: Trigger Amplify Release
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Trigger Amplify release (app connected to GitHub)
        run: |
          set -e
          JOB_ID=$(aws amplify start-job --app-id ${{ secrets.AMPLIFY_APP_ID }} --branch-name main --job-type RELEASE --query 'jobSummary.jobId' --output text)
          echo "✅ Amplify job started (Job ID: $JOB_ID)"
