name: CI/CD

on:
  push:
    branches: ['main', 'ci/cd']
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/ci-cd.yml'
  pull_request:
    branches: ['main', 'ci/cd']
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/ci-cd.yml'
  workflow_dispatch:

env:
  DOCKERHUB_REPO: ${{ secrets.DOCKERHUB_USERNAME }}/mini-ecommerce-backend

jobs:
  changes:
    name: Detect Changed Scope
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci-cd.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci-cd.yml'

  ci-backend:
    name: CI Backend
    runs-on: ubuntu-latest
    needs: [changes]
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.backend == 'true' }}
    defaults:
      run:
        working-directory: backend

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: test_db
          MYSQL_USER: test
          MYSQL_PASSWORD: test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test
        env:
          NODE_ENV: test
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: test
          DB_PASSWORD: test
          DB_NAME: test_db
          ACCESS_TOKEN_SECRET: test_secret

  ci-frontend:
    name: CI Frontend
    runs-on: ubuntu-latest
    needs: [changes]
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.frontend == 'true' }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm run test:ci
        env:
          NODE_ENV: test

      - name: Build
        run: npm run build
        env:
          NODE_ENV: production

  cd-backend:
    name: CD Backend (Docker Hub + EC2)
    runs-on: ubuntu-latest
    needs: [changes, ci-backend]
    if: >-
      needs.changes.outputs.backend == 'true' &&
      needs.ci-backend.result == 'success' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.DOCKERHUB_REPO }}:${{ github.sha }}
            ${{ env.DOCKERHUB_REPO }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

            docker pull ${{ env.DOCKERHUB_REPO }}:latest

            cd mini-ecommerce || exit 1

            docker rm -f ecommerce-backend || true

            docker-compose -f docker-compose.yml down --remove-orphans || true

            docker-compose -f docker-compose.yml pull backend

            docker-compose -f docker-compose.yml up -d --force-recreate backend

            docker image prune -f

            echo "✅ Backend deployed successfully"

  cd-frontend:
    name: CD Frontend (Amplify)
    runs-on: ubuntu-latest

    concurrency:
      group: amplify-main
      cancel-in-progress: false

    needs: [changes, ci-frontend]
    if: >-
      needs.changes.outputs.frontend == 'true' &&
      needs.ci-frontend.result == 'success' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Wait for existing Amplify job (safe)
        run: |
          set -e

          APP_ID=${{ secrets.AMPLIFY_APP_ID }}
          BRANCH=main

          echo "🔍 Checking running Amplify jobs..."

          while true; do
            RUNNING=$(aws amplify list-jobs \
              --app-id $APP_ID \
              --branch-name $BRANCH \
              --max-results 5 \
              --query "jobSummaries[?status=='RUNNING' || status=='PENDING'] | length(@)" \
              --output text)

            echo "⏳ Running jobs count: $RUNNING"

            if [[ "$RUNNING" == "0" ]]; then
              echo "✅ Amplify is free"
              break
            fi

            echo "⏳ Amplify busy... waiting 30s"
            sleep 30
          done

      - name: Trigger Amplify release & wait
        run: |
          set -e

          APP_ID=${{ secrets.AMPLIFY_APP_ID }}
          BRANCH=main

          JOB_ID=$(aws amplify start-job \
            --app-id $APP_ID \
            --branch-name $BRANCH \
            --job-type RELEASE \
            --query 'jobSummary.jobId' \
            --output text)

          echo "🚀 Amplify job started: $JOB_ID"

          while true; do
            STATUS=$(aws amplify get-job \
              --app-id $APP_ID \
              --branch-name $BRANCH \
              --job-id $JOB_ID \
              --query 'job.summary.status' \
              --output text)

            echo "⏳ Job status: $STATUS"

            if [[ "$STATUS" == "SUCCEED" ]]; then
              echo "✅ Success"
              break
            elif [[ "$STATUS" == "FAILED" || "$STATUS" == "CANCELLED" ]]; then
              echo "❌ Failed"
              exit 1
            fi

            sleep 20
          done
